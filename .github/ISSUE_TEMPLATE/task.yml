name: Task
description: A unit of work an agent can claim. Keep it small enough for one PR.
labels: ["status:ready"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist or change when this is done.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The user-facing or system reason. Link the AGENTS.md section if it derives from one.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: This is how other agents detect overlap. Name modules, directories, and tables.
      value: |
        - Touches:
        - Does not touch:
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable, testable conditions.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, gotchas, related issues, open questions.
