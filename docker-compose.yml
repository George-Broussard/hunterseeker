# Local development services for hunter/seeker.
#   docker compose up -d db      # start Postgres 16 + pgvector
#   docker compose down          # stop (data persists in the named volume)
#   docker compose down -v       # stop and wipe the database
# Credentials/port come from .env (see .env.example); defaults match the app's DATABASE_URL.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hunterseeker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hunterseeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hunterseeker}
      POSTGRES_DB: ${POSTGRES_DB:-hunterseeker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hunterseeker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hunterseeker-pgdata:
